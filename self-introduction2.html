<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./style.css" />
        <title>自己紹介 -三宅希望-</title>
    </head>
    <body>
        <img
            class="header_photo"
            src="./img/header.jpg"
            alt="ロンドンの風景"
            width="100%"
        />
        <h1>自己紹介</h1>

        <section class="content_wrapper">
            <div class="content">
                <h2>プロフィール</h2>
                <p>名前　：三宅希望</p>
                <p>年齢　：29歳</p>
                <p>出身地：長野県</p>
                <p>趣味　：編み物、読書、旅行</p>
            </div>

            <div class="content">
                <h2>好きな物</h2>
                <ul>
                    <li>コーヒー</li>
                    <li>辛いもの</li>
                    <li>肉</li>
                </ul>
            </div>

            <div class="content">
                <h2>今年の目標</h2>
                <ol>
                    <li>睡眠時間を削らないで学習する</li>
                    <li>週30時間の学習継続</li>
                    <li>PHP入門を終わらせる</li>
                </ol>
            </div>

            <div class="content">
                <h2>リンク</h2>
                <a href="https://github.com/nmiyake8888" target="_blank"
                    >GitHub</a
                ><br />
                <a href="https://x.com/nmiyake_8888" target="_blank"
                    >X(旧Twitter)</a
                >
            </div>
        </section>

        <section class="photo">
            <h2>好きな風景</h2>
            <div>
                <img
                    class="photo_item"
                    src="./img/The Elizabeth Tower.jpg"
                    alt="ビッグベン"
                />
                <img
                    class="photo_item"
                    src="./img/St Pancras International.jpg"
                    alt="セントパンクラス駅"
                />
                <img
                    class="photo_item"
                    src="./img/Christchurch College.jpg"
                    alt="クライストチャーチカレッジ"
                />
                <img
                    class="photo_item"
                    src="./img/The British Museum.jpg"
                    alt="大英博物館"
                />
                <img
                    class="photo_item"
                    src="./img/Baker Street Station.jpg"
                    alt="ベイカーストリート駅"
                />
            </div>
        </section>

        <section class="contact_form">
            <h2>お問い合わせ</h2>
            <form class="form_wrapper" action="submit" method="post">
                <div>
                    <label for="name">お名前：</label>
                    <br />
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="山田 太郎"
                        required
                    />
                </div>
                <div>
                    <label for="contact-type">お問い合わせ内容：</label>
                    <br />
                    <select name="category" id="contact-type">
                        <option value="">-- 選択してください --</option>
                        <option value="normal-contact">
                            一般的なお問い合わせ
                        </option>
                        <option value="comments-and-requests">
                            ご意見・ご要望
                        </option>
                    </select>
                </div>
                <div>
                    <label for="message">お問い合わせ内容：</label>
                    <br />
                    <textarea
                        name="contact-message"
                        id="message"
                        rows="5"
                        cols="20"
                        placeholder="お問い合わせ内容をご記入ください"
                        required
                    ></textarea>
                </div>
                <div>
                    <button type="submit">送信する</button>
                </div>
            </form>
        </section>
        <footer>
            <p>© Crema Create</p>
        </footer>
    </body>
</html>
